[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phantomradar-contract"
version = "0.2.0"
description = "Offline normalized telemetry contract and unavailable-evidence diagnostics"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["phantomradar*", "mmsilent*"]
